
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/iconfavi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrilha</title>
    <meta name="description" content="Gerencie suas tarefas com Thrilha" />
    <meta name="author" content="Lovable" />

    <meta property="og:title" content="Thrilha" />
    <meta property="og:description" content="Gerencie suas tarefas com Thrilha" />
    <meta property="og:type" content="website" />
    
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Script essencial do Lovable para funcionalidades Pick and Edit -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    
    <!-- Script principal com caminho correto baseado no ambiente -->
    <script type="text/javascript">
      // Detectar ambiente e usar o caminho correto
      var isGitHubPages = window.location.hostname.includes('github.io');
      var isLovable = window.location.hostname.includes('lovable.app');
      var scriptPath;
      
      if (isGitHubPages) {
        scriptPath = '/thrilha/src/main.tsx';
      } else if (isLovable) {
        scriptPath = '/src/main.tsx';
      } else {
        // Para Vercel e outros ambientes de produção
        scriptPath = './src/main.tsx';
      }
      
      var mainScript = document.createElement('script');
      mainScript.type = 'module';
      mainScript.src = scriptPath;
      document.head.appendChild(mainScript);
    </script>
  </body>
</html>
