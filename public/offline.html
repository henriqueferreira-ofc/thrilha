<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thrilha - Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #05000c;
        --foreground: #f5f4ff;
        --accent: #7c3aed;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.25), transparent 55%),
          radial-gradient(circle at 80% 0%, rgba(98, 56, 229, 0.15), transparent 60%),
          radial-gradient(circle at 50% 80%, rgba(79, 70, 229, 0.2), transparent 65%),
          var(--background);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--foreground);
        padding: 24px;
        text-align: center;
      }
      main {
        max-width: 420px;
        width: 100%;
        padding: 32px;
        background: rgba(12, 10, 24, 0.8);
        border-radius: 24px;
        border: 1px solid rgba(124, 58, 237, 0.3);
        backdrop-filter: blur(14px);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #c084fc, #a855f7, #7c3aed);
        -webkit-background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: rgba(245, 244, 255, 0.75);
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 18px;
        border-radius: 999px;
        border: 1px solid rgba(124, 58, 237, 0.5);
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.9), rgba(129, 140, 248, 0.9));
        color: var(--foreground);
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      button:active {
        transform: scale(0.98);
      }
      button:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.35);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline</h1>
      <p>
        Sem conexão com a internet. Assim que estiver online novamente, toque no botão abaixo para tentar recarregar o Thrilha.
      </p>
      <button type="button" onclick="window.location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
