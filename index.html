
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./iconfavi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrilha</title>
    <meta name="description" content="Gerencie suas tarefas com Thrilha" />
    <meta name="author" content="Lovable" />

    <meta property="og:title" content="Thrilha" />
    <meta property="og:description" content="Gerencie suas tarefas com Thrilha" />
    <meta property="og:type" content="website" />
    
    <script type="text/javascript">
      // GitHub Pages SPA redirect handling
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Carregar o script do GPT Engineer apenas em desenvolvimento ou preview do Lovable -->
    <script type="text/javascript">
      // Detectar se estamos em ambiente de desenvolvimento ou preview do Lovable
      var isDev = window.location.hostname === 'localhost' || 
                  window.location.hostname.includes('lovable.app') ||
                  window.location.hostname.includes('preview--');
      
      if (isDev) {
        var script = document.createElement('script');
        script.src = 'https://cdn.gpteng.co/gptengineer.js';
        script.type = 'module';
        document.head.appendChild(script);
      }
    </script>
    
    <!-- Script principal com caminho dinâmico baseado no ambiente -->
    <script type="text/javascript">
      // Detectar se estamos no GitHub Pages e ajustar o caminho do script
      var isGitHubPages = window.location.hostname.includes('github.io');
      var scriptPath = isGitHubPages ? '/thrilha/src/main.tsx' : './src/main.tsx';
      
      var mainScript = document.createElement('script');
      mainScript.type = 'module';
      mainScript.src = scriptPath;
      document.head.appendChild(mainScript);
    </script>
  </body>
</html>
